<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daniela Piña — 3D Generalist & Motion Graphic Designer. Motion graphics, 3D animation and broadcast design. Barcelona, Spain." />
    <title>Daniela Piña — 3D Generalist & Motion Graphic Designer</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!--
      Import map: los loaders de three.js (examples/jsm/loaders/*) hacen
      `import ... from 'three'` internamente. Sin este mapa, el navegador
      no sabe a qué URL corresponde "three" y el import falla en
      silencio — el modelo real nunca se carga y se queda en el
      fallback procedural. Debe coincidir con THREE_VERSION en
      public/scripts/pineapple-hero.js.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/scripts/pineapple-hero.js"></script>
  </body>
</html>
